[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-prediction"
version = "0.1.0"
description = "AI Agent 团队驱动的市场预测系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "PyYAML>=6.0.0",
    "akshare>=1.12.0",
    "yfinance>=0.2.30",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
web = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]
data = [
    "akshare>=1.12.0",
    "yfinance>=0.2.30",
    "beautifulsoup4>=4.12.0",
]
quant = [
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    "scipy>=1.10.0",
    "joblib>=1.4.0",
    "pyarrow>=18.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp -p no:cacheprovider -m 'not slow and not network and not llm'"
testpaths = ["tests"]
markers = [
    "asyncio: async tests handled by pytest-asyncio when the dev dependency is installed",
    "slow: tests that are intentionally slow or depend on external services",
    "network: tests that require live network access",
    "integration: tests that exercise multiple project layers together",
    "llm: tests that require a configured LLM API key",
]
